<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hevesi LSC – Csapatom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header + tab bar over one centered work column; pitch and candidate list side by side on wide screens. */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface-2:#e7ece4; --fg:#16201a; --muted:#56635a; --line:#d2dacd;
  --accent:#1d6b39; --accent-fg:#ffffff; --accent-soft:#dcebdf;
  --pitch:#2e7a45; --pitch-2:#2a7140; --chalk:rgba(255,255,255,.82);
  --t12:#2457b5; --t13:#b8501a; --h13:#7a3c9e;
  --good:#1b7a3d; --warn:#9a6a00; --bad:#bf3328; --warn-soft:#f6ecd2; --bad-soft:#f7dedb;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1310; --surface:#161d18; --surface-2:#1f2822; --fg:#e4ebe5; --muted:#99a69c; --line:#2b362e;
  --accent:#55c47a; --accent-fg:#06120a; --accent-soft:#1d3324;
  --pitch:#1d4f2e; --pitch-2:#1a482a; --chalk:rgba(255,255,255,.6);
  --t12:#86a8ff; --t13:#ff9d61; --h13:#c991ea;
  --good:#62d38e; --warn:#e9b440; --bad:#ff7d70; --warn-soft:#3a2f12; --bad-soft:#3d1c19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1310; --surface:#161d18; --surface-2:#1f2822; --fg:#e4ebe5; --muted:#99a69c; --line:#2b362e;
  --accent:#55c47a; --accent-fg:#06120a; --accent-soft:#1d3324;
  --pitch:#1d4f2e; --pitch-2:#1a482a; --chalk:rgba(255,255,255,.6);
  --t12:#86a8ff; --t13:#ff9d61; --h13:#c991ea;
  --good:#62d38e; --warn:#e9b440; --bad:#ff7d70; --warn-soft:#3a2f12; --bad-soft:#3d1c19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:12px 4px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand .sub{color:var(--muted);font-size:13px}
.brand .ro{margin-left:auto;font-size:12px;color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:18px 60px}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
.chip.t12{color:var(--t12)} .chip.t13{color:var(--t13)} .chip.h13{color:var(--h13)}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.plain{color:var(--muted);border-color:var(--line)}
.chip.ok{color:var(--good);border-color:transparent;background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

/* next match */
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.next .when{font-family:var(--display);text-align:center;min-width:64px}
.next .when b{display:block;font-size:34px;line-height:1}
.next .when span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.next .what{min-width:0}
.next .opp{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15}
.next .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}

/* match list */
.month{margin:18px 0 6px}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.m{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.m:hover{background:var(--surface-2)}
.m.past{opacity:.72}
.m .d{font-family:var(--display);text-align:center;line-height:1.05}
.m .d b{font-size:24px;display:block;font-variant-numeric:tabular-nums}
.m .d span{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.m .mid{min-width:0}
.m .o{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .right{text-align:right;font-size:13px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.res{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.res.w{color:var(--good)} .res.l{color:var(--bad)} .res.d{color:var(--muted)}
.cnt{font-variant-numeric:tabular-nums;color:var(--muted)}
.cnt.zero{color:var(--warn)}

/* table */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:600;font-size:12px;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.l,th.l{text-align:left}
tr.sq td{background:var(--surface-2);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted);text-align:left}
td .num{font-family:var(--display);font-weight:700}
.tick{color:var(--accent);font-weight:700}
.zero{color:var(--line)}
td.hl{background:var(--accent-soft)}

/* squad cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr 92px;gap:6px 10px;text-align:left;width:100%;align-items:start}
.card:hover{border-color:var(--accent)}
.card .who{display:flex;gap:10px;align-items:flex-start;min-width:0}
.shirt{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;min-width:38px;height:42px;border-radius:8px 8px 12px 12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-variant-numeric:tabular-nums}
.card .name{font-weight:600;line-height:1.2}
.card .info{font-size:12px;color:var(--muted)}
.card .pos{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.card svg{width:92px;height:92px}
.avg{font-family:var(--display);font-size:13px;color:var(--muted)}
.ava{position:relative;width:46px;height:52px;flex:none}
.ava img{width:46px;height:52px;object-fit:cover;border-radius:8px;display:block;background:var(--surface-2)}
.ava b{position:absolute;right:-6px;bottom:-6px;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:14px;line-height:1;padding:3px 5px;border-radius:6px;font-variant-numeric:tabular-nums}
.ava.lg,.ava.lg img{width:64px;height:72px}
.mlsz{font-size:12px;color:var(--muted)}
.mlsz b{color:var(--fg);font-variant-numeric:tabular-nums}
.stbl td,.stbl th{padding:5px 8px;font-size:13px}
.photo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.scorers{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:38px}
.part i{display:block;width:34px;height:4px;border-radius:2px;background:var(--surface-2);position:relative;overflow:hidden}
.part i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--accent)}
.rep{display:flex;flex-direction:column}
.rep .r{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:5px 2px;border-top:1px solid var(--line);font-size:14px}
.rep .r .n{font-family:var(--display);font-weight:700;font-size:17px;text-align:center}
.rep .r .e{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ball{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:700}
.card-y{display:inline-block;width:11px;height:15px;border-radius:2px;background:#e9b440}
.card-r{display:inline-block;width:11px;height:15px;border-radius:2px;background:#d4382c}
.syncinfo{font-size:12px;color:var(--muted)}
tr.ours td{background:var(--accent-soft);font-weight:600}
.form{display:inline-flex;gap:3px}
.form b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;color:#fff}
.form .w{background:var(--good)} .form .d{background:var(--muted)} .form .l{background:var(--bad)}
.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.rl{display:grid;grid-template-columns:56px minmax(0,1fr) 52px minmax(0,1fr);gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.rl:first-child{border-top:0}
.rl .h{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .sc{text-align:center;font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.rl.ours{background:var(--accent-soft)}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;margin:12px 0 8px}
.avg b{font-size:18px;color:var(--fg)}

/* lineup */
.lineup{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.lineup{grid-template-columns:minmax(0,1fr)}}
.pitchbox{background:var(--pitch);border-radius:var(--r);padding:8px;max-width:440px;width:100%}
.pitchbox svg{display:block;width:100%;height:auto}
.slot{cursor:pointer}
.slot:focus{outline:none}
.slot:focus-visible .ring{stroke:#ffe46b;stroke-width:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.cand{display:grid;grid-template-columns:34px 1fr 74px;gap:10px;align-items:center;padding:7px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.cand:hover{background:var(--surface-2)}
.cand .n{font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.cand .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .nm small{display:block;color:var(--muted);font-size:12px}
.fitbar{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.fitbar i{display:block;height:6px;border-radius:3px;width:34px;background:var(--surface-2);position:relative;overflow:hidden}
.fitbar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c)}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* dialogs */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,14,10,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg header{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dlg header .grow{flex:1;min-width:0}
.dlg .body{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.dlg footer{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg footer .grow{flex:1}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--fg);font-size:15px;width:100%}
.pick{display:flex;flex-direction:column}
.pl{display:grid;grid-template-columns:26px 34px 1fr auto;gap:8px;align-items:center;padding:7px 2px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.pl:disabled{cursor:not-allowed;opacity:.55}
.box{width:20px;height:20px;border:2px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accent-fg)}
.pl[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.pl .n{font-family:var(--display);font-weight:700;font-size:19px;text-align:center}
.pl .nm{min-width:0}
.pl .nm small{display:block;font-size:12px;color:var(--muted)}
.pl .bd{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 0}
.dots{display:flex;gap:4px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.dots button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.posgrid{display:flex;flex-wrap:wrap;gap:6px}
.posgrid button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-weight:600;font-size:13px}
.posgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
@media (prefers-reduced-motion:no-preference){.slot circle,.slot text{transition:all .15s}}
</style>
<style>
html{color-scheme:light}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
.tchip{display:inline-flex;align-items:center;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;line-height:1.7;white-space:nowrap;background:hsl(var(--h) 52% 40%);color:#fff}
@media (prefers-color-scheme: dark){.tchip{background:hsl(var(--h) 55% 62%);color:#0b120d}}
.userbar{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}
.brand a{color:var(--muted);font-size:13px}
.sqbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:6px}
.sqchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-weight:600;font-size:13px;color:var(--muted)}
.sqchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Hevesi LSC <span>Csapatom</span></h1>
      <div class="sub"><a href="edzok.html">← Edzőknek</a></div><div class="syncinfo" id="syncinfo"></div>
      <div class="ro" id="ro" hidden>Csak olvasható nézet</div>
      <div class="userbar" id="userbar"></div>
    </div>
    <div class="sqbar" id="sqbar"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="meccsek" aria-selected="true">Meccsek</button>
      <button role="tab" data-tab="beosztas" aria-selected="false">Statisztika</button>
      <button role="tab" data-tab="keret" aria-selected="false">Keret</button>
      <button role="tab" data-tab="felallas" aria-selected="false">Felállás</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty" id="boot">Betöltés…</div>
</main>

<dialog id="dlgMatch"><div class="dlg" id="dlgMatchIn"></div></dialog>
<dialog id="dlgPlayer"><div class="dlg" id="dlgPlayerIn"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
let TEAMS={};   // bajnoki csapatkód → {short,long,minYear,squad} – a klub.json-ból épül
const SQUADS=[["FELNOTT","Felnőtt"],["F3","Felnőtt II."],["U21","U21"],["U17","U17"],["U16","U16"],["U15","U15"],["U14","U14"],["U13","U13"],["U12","U12"],["NOI","Női"]];
const SQN=Object.fromEntries(SQUADS);
const SQUAD_OF={F2:"FELNOTT",KUPA:"FELNOTT",MAKL:"FELNOTT",U14R:"U14",U14H:"U14",U13R:"U13",U13H:"U13"};
const sqOf=c=>SQUAD_OF[c]||c;
const HELP={U13:["U12"],U14:["U13"],U15:["U14"],U16:["U15"],U17:["U16"],U21:["U17"],F3:["U21"],FELNOTT:["F3","U21"]};   // fiatalabb kisegítő korosztályok
const HUE={F2:150,F3:120,KUPA:95,MAKL:70,U21:200,U17:225,U16:250,U15:275,U14R:300,U14H:325,U13R:20,U13H:40,U12:0,NOI:180};
const minYearOf=sq=>{const m=/^U(\d+)$/.exec(sq);return m?2027-Number(m[1]):0};
const VT=()=>Object.keys(TEAMS).filter(c=>S.view.includes(TEAMS[c].squad));
const inView=m=>S.view.includes(TEAMS[m.team]?.squad);

const SKILLS=[

function role(p,m){
  if(official(m)){const a=m.mlsz.start.find(x=>x.p===p.id);if(a)return{k:"start",x:a};const b=m.mlsz.subs.find(x=>x.p===p.id);if(b)return{k:"sub",x:b};return null;}
  return (m.sel||[]).includes(p.id)?{k:"sel",x:null}:null;
}
function teamPlayed(){const n={};for(const k of Object.keys(TEAMS))n[k]=0;for(const m of S.matches)if(isPlayed(m))n[m.team]++;return n}
function stats(p){

  for(const m of S.matches){if(!isPlayed(m))continue;const ro=role(p,m);if(!ro)continue;

function scorers(m){if(!official(m))return"";return[...m.mlsz.start,...m.mlsz.subs].filter(x=>x.g).sort((a,b)=>b.g-a.g).map(x=>{const pl=pById(x.p);return esc(pl?short(pl.name):x.n)+(x.g>1?" "+x.g:"")}).join(", ")}
const photoUrl=p=>p&&p.photo?S.photoUrls[p.photo]||null:null;

function mlszCur(p){const s=(p.mlsz?.seasons||[]).filter(x=>x.season===SEASON);const t={app:0,start:0,sub:0,bench:0,goals:0,yellow:0,red:0,comps:[]};
  for(const x of s)for(const c of x.comps){t.comps.push(c);for(const k of["app","start","sub","bench","goals","yellow","red"])t[k]+=c[k]||0;}return t;}
function shirt(p,lg){const u=photoUrl(p);return u?`<div class="ava${lg?" lg":""}"><img src="${u}" alt=""><b>${esc(p.num)}</b></div>`:`<div class="shirt">${esc(p.num||"?")}</div>`}
function avg(p,keys){let s=0,n=0;for(const k of keys){const v=p.sk?.[k];if(v>0){s+=v;n++;}}return n?s/n:null}
function fit(p,code){
  const role=POS_ROLE[code],w=ROLE_W[role];let s=0,wt=0;
  for(const k in w){const v=p.sk?.[k];if(v>0){s+=v*w[k];wt+=w[k];}}
  const rated=wt>=.4;let v=rated?s/wt:2.5;const pos=p.pos||[];
  if(pos.includes(code))v+=.6;else if(pos.some(c=>POS_ROLE[c]===role))v+=.3;
  if(role==="GK"&&!pos.includes("KAP"))v-=1.2;
  if(role!=="GK"&&pos.length===1&&pos[0]==="KAP")v-=1;
  const side=POS_SIDE[code];
  if(side&&p.foot){if(p.foot==="mind")v+=.2;else if((side==="L")===(p.foot==="bal"))v+=.25;else v-=.1;}
  return {v:Math.max(0,Math.min(5,v)),rated};
}

// Magyar módszer (min. költség), sorok<=oszlopok
function hungarian(c){
  const n=c.length,m=c[0].length,INF=1e9,u=Array(n+1).fill(0),v=Array(m+1).fill(0),p=Array(m+1).fill(0),way=Array(m+1).fill(0);
  for(let i=1;i<=n;i++){p[0]=i;let j0=0;const minv=Array(m+1).fill(INF),used=Array(m+1).fill(false);
    do{used[j0]=true;const i0=p[j0];let d=INF,j1=0;
      for(let j=1;j<=m;j++)if(!used[j]){const cur=c[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0;}if(minv[j]<d){d=minv[j];j1=j;}}
      for(let j=0;j<=m;j++){if(used[j]){u[p[j]]+=d;v[j]-=d;}else minv[j]-=d;}
      j0=j1;}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1;}while(j0);}
  const res=Array(n).fill(-1);for(let j=1;j<=m;j++)if(p[j])res[p[j]-1]=j-1;return res;
}

async function flush(id){
  if(busy[id]||!pend[id])return;delete pend[id];busy[id]=true;
  const m=mById(id);
  const {error}=await sb.from("squad_matches").upsert({key:id,squad:TEAMS[m.team].squad,sel:m.sel||[],lineup:curLineup(m),res:m.manualRes||"",updated_by:S.me,updated_at:new Date().toISOString()});

  busy[id]=false;if(pend[id])flush(id);
}

/* ---------- radar ---------- */
function radar(p,size,labels){
  const n=SKILLS.length,cx=50,cy=50,R=labels?30:42,pts=[],grid=[];
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  for(let lv=1;lv<=5;lv++){grid.push(SKILLS.map((_,i)=>[cx+Math.cos(ang(i))*R*lv/5,cy+Math.sin(ang(i))*R*lv/5].map(x=>x.toFixed(1)).join(",")).join(" "));}
  let any=false;
  SKILLS.forEach((s,i)=>{const v=p.sk?.[s.k]||0;if(v)any=true;pts.push([cx+Math.cos(ang(i))*R*v/5,cy+Math.sin(ang(i))*R*v/5].map(x=>x.toFixed(1)).join(","))});
  let out=`<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Képességprofil">`;
  grid.forEach((g,i)=>out+=`<polygon points="${g}" fill="${i===4?"var(--surface-2)":"none"}" stroke="var(--line)" stroke-width=".5"/>`);
  SKILLS.forEach((s,i)=>{out+=`<line x1="50" y1="50" x2="${(cx+Math.cos(ang(i))*R).toFixed(1)}" y2="${(cy+Math.sin(ang(i))*R).toFixed(1)}" stroke="var(--line)" stroke-width=".4"/>`;
    if(labels){const lx=cx+Math.cos(ang(i))*(R+9),ly=cy+Math.sin(ang(i))*(R+9);const a=Math.abs(lx-50)<4?"middle":lx<50?"end":"start";
      out+=`<text x="${lx.toFixed(1)}" y="${(ly+1.5).toFixed(1)}" font-size="4.6" text-anchor="${a}" fill="var(--muted)" font-family="Barlow Condensed, sans-serif">${s.s}</text>`;}});
  if(any)out+=`<polygon points="${pts.join(" ")}" fill="var(--accent)" fill-opacity=".28" stroke="var(--accent)" stroke-width="1.2" stroke-linejoin="round"/>`;
  else out+=`<text x="50" y="52" text-anchor="middle" font-size="${labels?5:7}" fill="var(--muted)" font-family="Barlow, sans-serif">nincs értékelve</text>`;
  return out+"</svg>";
}

const OUR={REG12:"334732",REG13:"334741",HEV13:"331576"};
function standings(ms,our){
  const T={};const row=(id,n)=>T[id]||(T[id]={id,n,m:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,res:[]});
  for(const x of ms){row(x.hid,x.h);row(x.aid,x.a);if(x.st!=="played")continue;
    for(const [id,g,o] of [[x.hid,x.hg,x.ag],[x.aid,x.ag,x.hg]]){const r=T[id];r.m++;r.gf+=g;r.ga+=o;
      if(g>o){r.w++;r.pts+=3;r.res.push([x.d,"w"])}else if(g===o){r.d++;r.pts++;r.res.push([x.d,"d"])}else{r.l++;r.res.push([x.d,"l"])}}}
  return Object.values(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.n.localeCompare(b.n,"hu"));
}

  h+=`<h2>${esc(TEAMS[S.lg].long)}</h2><div class="small muted" style="margin:2px 0 12px">Nem hivatalos tabella: az MLSZ adatbank ehhez a korosztályhoz nem közöl tabellát, ezért a ${played} lejátszott meccs eredményéből számoltam (győzelem 3, döntetlen 1 pont; holtversenyben a gólkülönbség, majd a több rúgott gól dönt). Frissítve: ${esc((L.updated||"").replace(/-/g,". "))}.</div>`;

  rows.forEach((r,i)=>{const gd=r.gf-r.ga;const f=r.res.sort((a,b)=>a[0].localeCompare(b[0])).slice(-5).map(([,x])=>`<b class="${x}">${x==="w"?"GY":x==="d"?"D":"V"}</b>`).join("");

function resizeImage(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const max=480,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("load"))};img.src=u;});}

/* ---------- importálás (régi Kispad) ----------
   A fájl: {v:1, players:[{id, squad, name, num, birth, foot, pos, list, mlsz_id, mlsz, sk, note, photo:"data:image/jpeg;base64,…"}],
   matches:[{key, squad, sel:[régi id], lineup:{f, s:[régi id]}, res, note}]}. Többször is lefuttatható: a meglévő játékost frissíti. */
async function importFile(file){
  if(!isAdmin()){toast("Importálni csak a vezetőség tud.");return;}
  let d;try{d=JSON.parse(await file.text());}catch(e){toast("A fájl nem olvasható.");return;}
  if(!d||d.v!==1||!Array.isArray(d.players)){toast("Ez nem Kispad-mentés.");return;}
  const prog=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);};
  const norm=x=>(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
  const ex=await sb.from("players").select("id,name,squad,mlsz_id");if(ex.error){toast("Nem sikerült: "+ex.error.message);return;}
  const byM=Object.fromEntries(ex.data.filter(p=>p.mlsz_id).map(p=>[p.mlsz_id,p.id])),byN=Object.fromEntries(ex.data.map(p=>[norm(p.name),p.id]));
  const map={},now=new Date().toISOString();let i=0,fail=0;
  for(const p of d.players){i++;prog(`Importálás… játékos ${i}/${d.players.length}`);
    const body={squad:p.squad,name:p.name,num:String(p.num||""),birth:p.birth||null,foot:p.foot||"",pos:p.pos||[],list:p.list||"",updated_at:now};
    if(p.mlsz_id)body.mlsz_id=p.mlsz_id;if(p.mlsz)body.mlsz=p.mlsz;
    let id=(p.mlsz_id&&byM[p.mlsz_id])||byN[norm(p.name)],r;
    if(id)r=await sb.from("players").update(body).eq("id",id);else{r=await sb.from("players").insert(body).select("id").single();if(!r.error)id=r.data.id;}
    if(r.error){fail++;continue;}map[p.id]=id;
    await sb.from("player_evals").upsert({player_id:id,squad:p.squad,sk:p.sk||{},note:p.note||"",updated_by:S.me,updated_at:now});
    if(p.photo&&p.photo.startsWith("data:")){const blob=await fetch(p.photo).then(x=>x.blob()),path=p.squad+"/"+id+".jpg";
      const up=await sb.storage.from("player-photos").upload(path,blob,{upsert:true,contentType:"image/jpeg"});
      if(!up.error){await sb.from("players").update({photo:path}).eq("id",id);delete S.photoUrls[path];}else fail++;}}
  const mp=x=>map[x]||"";i=0;
  for(const m of d.matches||[]){i++;prog(`Importálás… meccs ${i}/${d.matches.length}`);
    const {error}=await sb.from("squad_matches").upsert({key:m.key,squad:m.squad,sel:(m.sel||[]).map(mp).filter(Boolean),lineup:{f:m.lineup?.f||"3-3-2",s:(m.lineup?.s||[]).map(mp)},res:m.res||"",note:m.note||"",updated_by:S.me,updated_at:now});
    if(error)fail++;}
  toast(fail?`Kész, de ${fail} tételt nem sikerült menteni.`:`Kész: ${d.players.length} játékos és ${(d.matches||[]).length} meccs importálva.`);loadAll();
}

/* ---------- felállás műveletek ---------- */
function curLineup(m){const lu=m.lineup||{};const s=(lu.s||[]).slice(0,9);while(s.length<9)s.push("");return {f:FORM[lu.f]?lu.f:"3-3-2",s}}
function autoFill(m){
  const lu=curLineup(m),slots=FORM[lu.f];
  const empty=lu.s.map((v,i)=>v?null:i).filter(i=>i!==null);
  const free=candidates(m).filter(p=>!lu.s.includes(p.id));
  if(!empty.length||!free.length){toast(free.length?"Minden poszt foglalt.":"Nincs több szabad játékos.");return;}
  const cols=Math.max(free.length,empty.length);
  const cost=empty.map(i=>Array.from({length:cols},(_,j)=>j<free.length?10-fit(free[j],slots[i][0]).v:100));
  const r=hungarian(cost);
  empty.forEach((i,k)=>{const j=r[k];if(j>=0&&j<free.length)lu.s[i]=free[j].id;});
  saveMatch(m.id,{lineup:lu});
}

function buildMatches(){
  const K=S.klub;if(!K)return;TEAMS={};S.matches=[];
  const byMlsz=Object.fromEntries(S.players.filter(p=>p.mlsz_id).map(p=>[p.mlsz_id,p.id]));
  for(const [c,t] of Object.entries(K.teams)){const sq=sqOf(c);if(!SQN[sq])continue;
    TEAMS[c]={short:t.name,long:t.league,minYear:minYearOf(sq),squad:sq};
    const seen={};
    for(const f of (t.fixtures||[]).slice().sort((a,b)=>(a.d+(a.t||"")).localeCompare(b.d+(b.t||"")))){seen[f.d]=(seen[f.d]||0)+1;const key=c+"|"+f.d+(seen[f.d]>1?"#"+seen[f.d]:""),row=S.rows[key],rep=S.reports[key],home=f.hid===t.tid;
      const res=f.st==="played"?(home?f.hg+"–"+f.ag:f.ag+"–"+f.hg):(row?.res||"");
      const conv=a=>(a||[]).map(x=>({...x,p:byMlsz[x.id]||""}));
      S.matches.push({id:key,team:c,date:f.d,time:f.t,home,opp:home?f.a:f.h,venue:f.v,note:row?.note||"",res,manualRes:row?.res||"",

async function start(user){
  S.me=(user.email||"").toLowerCase();
  const {data:ms}=await sb.from("members").select("*");S.members=ms||[];S.member=S.members.find(m=>m.email===S.me)||null;
  if(!S.member){S.pLoaded=true;render();return;}
  let v=[];try{v=JSON.parse(localStorage.getItem("csapat.view")||"[]")}catch(_){}
  const al=allowedSquads();v=v.filter(s=>al.includes(s));
  S.view=v.length?v:(mySquads().length?mySquads():al.slice(0,1));S.view.sort((x,y)=>squadOrder(x)-squadOrder(y));
  S.klub=await fetch("data/klub.json",{cache:"no-cache"}).then(r=>r.json()).catch(()=>null);
  if(S.klub)$("#syncinfo").textContent="MLSZ adatok: "+S.klub.at.replace(/-/g,". ")+".";
  await loadAll();
  sb.channel("csapat").on("postgres_changes",{event:"*",schema:"public",table:"squad_matches"},p=>{if(busy[p.new?.key])return;clearTimeout(reloadT);reloadT=setTimeout(loadAll,400);}).subscribe();
}
render();
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user);else{S.noSession=true;render();}});
</script>
</body>
