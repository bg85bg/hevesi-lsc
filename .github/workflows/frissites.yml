name: Frissítés és közzététel

on:
  schedule:
    - cron: "40 5 */2 * *"   # kétnaponta, kb. 6:40 / 7:40 magyar idő szerint
  workflow_dispatch: {}       # kézi indítás: Actions fül → Run workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://nbocdaaqzizitnuxqmbb.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Adatok letöltése az MLSZ adatbankból
        if: github.event_name != 'push'
        run: |
          python3 -u scripts/build.py data/klub.new.json
          mv data/klub.new.json data/klub.json

      - name: Csapatom-adatok szinkronja (keretek, jegyzőkönyvek, statisztikák)
        if: github.event_name != 'push' && env.SUPABASE_SECRET_KEY != ''
        continue-on-error: true
        run: python3 -u scripts/supa_sync.py

      - name: Friss adatok mentése a tárolóba
        if: github.event_name != 'push'
        run: |
          git config user.name "frissites-bot"
          git config user.email "frissites-bot@users.noreply.github.com"
          git add data/klub.json
          git diff --cached --quiet || git commit -m "Adatfrissítés: $(date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
